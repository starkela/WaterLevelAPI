<!DOCTYPE html>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<title> Current water level</title>
<header>
<body>
    <h1>Current water level</h1>
    <div class = "outline">
        <div class = "filling" style="--percentage: {{percentage}};">
        <p>
        {{current_level}} L
        </p>
        </div>
    </div>

    <footer>
        <a href="{{ url_for('history') }}">History of water level</a>
    </footer>

    
</body>

<style>

.filling {
    text-align: center;
    position: absolute;
    bottom: 0px;
    width:300px;
    height: calc( var(--percentage) * 300px);
    margin:auto;
    background-color: aqua;
}
.outline {
    position: relative;
    width: 300px;
    height: 300px;
    margin:auto;
    border: 2px solid black;
}
</style>
